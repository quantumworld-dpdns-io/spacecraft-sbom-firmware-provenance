[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "spacecraft-sbom-provenance"
version = "0.1.0"
description = "Spacecraft SBOM and firmware provenance vault – tracks firmware hashes, dependencies, and secure update approvals for aerospace supply chains"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

authors = [
  { name = "quantumworld-dpdns-io" },
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Aerospace",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Build Tools",
]

dependencies = [
  "fastapi>=0.109,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.1,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "httpx>=0.26,<1",
  "cryptography>=42.0,<43",
  "python-multipart>=0.0.6,<1",
  "python-jose[cryptography]>=3.3,<4",
  "passlib[bcrypt]>=1.7,<2",
  "orjson>=3.9,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=4.1,<5",
  "pytest-asyncio>=0.23,<1",
  "pytest-xdist>=3.5,<4",
  "mypy>=1.8,<2",
  "ruff>=0.2,<1",
  "pre-commit>=3.6,<4",
  "tox>=4.12,<5",
  "ipython>=8.20,<9",
  "watchfiles>=0.21,<1",
  "httpx>=0.26,<1",
]
test = [
  "robotframework>=7.0,<8",
  "robotframework-requests>=0.9,<1",
  "robotframework-seleniumlibrary>=6.1,<7",
  "robotframework-jsonlibrary>=0.5,<1",
  "robotframework-faker>=5.0,<1",
  "pytest>=8.0,<9",
  "pytest-cov>=4.1,<5",
  "coverage>=7.4,<8",
  "factory-boy>=3.3,<4",
]
security = [
  "bandit>=1.7,<2",
  "safety>=3.0,<4",
  "semgrep>=1.50,<2",
  "pip-audit>=2.7,<3",
]
vector = [
  "chromadb>=0.4,<1",
  "lancedb>=0.6,<1",
  "qdrant-client>=1.9,<2",
]
analytics = [
  "duckdb>=0.10,<1",
  "pyarrow>=15.0,<1",
  "datafusion>=36.0,<37",
  "trino>=0.328,<1",
  "pyiceberg>=0.5,<1",
]
ai = [
  "openai>=1.12,<2",
  "anthropic>=0.23,<1",
  "ollama>=0.1,<1",
  "litellm>=1.40,<2",
]
all = [
  "spacecraft-sbom-provenance[dev,test,security,vector,analytics,ai]",
]

[project.urls]
Homepage = "https://github.com/quantumworld-dpdns-io/spacecraft-sbom-firmware-provenance"
Repository = "https://github.com/quantumworld-dpdns-io/spacecraft-sbom-firmware-provenance"
Documentation = "https://github.com/quantumworld-dpdns-io/spacecraft-sbom-firmware-provenance/docs"

[project.scripts]
sbom-provenance = "src.cli.main:cli_entry"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sbom_provenance*", "cli*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T10", "RUF"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-config --strict-markers"
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "slow: Slow tests",
  "security: Security tests",
  "owasp: OWASP Top 10 tests",
  "robot: Robot Framework tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "src/cli/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "pass",
]

[tool.coverage.html]
directory = "coverage_html"
