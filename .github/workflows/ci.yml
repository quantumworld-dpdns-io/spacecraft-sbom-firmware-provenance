name: CI Pipeline

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.7'

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      - name: Run ruff linter
        run: ruff check src/ tests/
      - name: Run ruff formatter check
        run: ruff format --check src/ tests/
      - name: Run mypy type checker
        run: mypy src/ --ignore-missing-imports

  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/test.txt
          pip install -e .
      - name: Run unit tests with coverage
        run: |
          pytest tests/unit -v --cov=src --cov-report=xml --cov-report=term
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests

  integration-tests:
    name: Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sbom
          POSTGRES_PASSWORD: sbom_secret
          POSTGRES_DB: sbom_provenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U sbom
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/test.txt
          pip install -e .
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://sbom:sbom_secret@localhost:5432/sbom_provenance
        run: pytest tests/integration -v --cov=src --cov-report=term

  security-tests:
    name: Security Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit
          pip install -r requirements/base.txt
      - name: Run Bandit SAST
        run: bandit -r src/ -ll -f json -o bandit-report.json || true
      - name: Run Safety check
        run: safety check --full-report || true
      - name: Run pip-audit
        run: pip-audit || true
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  robot-tests:
    name: Robot Framework Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/test.txt
          pip install -e .
      - name: Start test server
        run: |
          uvicorn sbom_provenance.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
      - name: Run Robot Framework tests
        run: |
          robot --outputdir tests/robot/output \
                --loglevel TRACE \
                --variable BASE_URL:http://localhost:8000 \
                tests/robot/
      - name: Upload Robot Framework results
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: tests/robot/output/
      - name: Publish Robot Framework report
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: tests/robot/output/report.html

  build:
    name: Build & Package
    needs: [unit-tests, integration-tests, security-tests, robot-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build
      - name: Build package
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
