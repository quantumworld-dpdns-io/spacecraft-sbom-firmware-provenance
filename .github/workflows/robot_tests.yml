name: Robot Framework Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  robot-tests:
    name: Robot Framework Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test_suite: [sbom, firmware, provenance, security, owasp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/test.txt
          pip install -e .
      - name: Start application server
        run: |
          uvicorn sbom_provenance.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -f http://localhost:8000/health || exit 1
      - name: Run ${{ matrix.test_suite }} Robot tests
        run: |
          robot --outputdir tests/robot/output/${{ matrix.test_suite }} \
                --loglevel TRACE \
                --variable BASE_URL:http://localhost:8000 \
                tests/robot/test_cases/${{ matrix.test_suite }}/
      - name: Upload ${{ matrix.test_suite }} results
        uses: actions/upload-artifact@v4
        with:
          name: robot-${{ matrix.test_suite }}-results
          path: tests/robot/output/${{ matrix.test_suite }}/
      - name: Publish ${{ matrix.test_suite }} report
        uses: actions/upload-artifact@v4
        with:
          name: robot-${{ matrix.test_suite }}-report
          path: tests/robot/output/${{ matrix.test_suite }}/report.html

  robot-summary:
    name: Robot Framework Summary
    needs: robot-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all results
        uses: actions/download-artifact@v4
      - name: Generate summary report
        run: |
          echo "# Robot Framework Test Summary" > robot-summary.md
          echo "| Suite | Passed | Failed | Total |" >> robot-summary.md
          echo "|-------|--------|--------|-------|" >> robot-summary.md
          for suit in sbom firmware provenance security owasp; do
            if [ -f "robot-${suit}-results/output.xml" ]; then
              total=$(grep -c 'test id=' "robot-${suit}-results/output.xml" || echo "0")
              passed=$(grep 'status="PASS"' "robot-${suit}-results/output.xml" | wc -l || echo "0")
              failed=$(grep 'status="FAIL"' "robot-${suit}-results/output.xml" | wc -l || echo "0")
              echo "| $suit | $passed | $failed | $total |" >> robot-summary.md
            fi
          done
      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: robot-summary
          path: robot-summary.md
