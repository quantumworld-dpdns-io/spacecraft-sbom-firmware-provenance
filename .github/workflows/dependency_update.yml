name: Dependency Management

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday
  workflow_dispatch:

jobs:
  dependency-update:
    name: Weekly Dependency Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit dependencies
        run: |
          pip-audit -r requirements/base.txt -r requirements/dev.txt -r requirements/test.txt -r requirements/security.txt --format markdown > dependency-audit.md || true
      - name: Create dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.md

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-licenses
        run: python -m pip install pip-licenses
      - name: Check licenses
        run: pip-licenses --allow-only="MIT;Apache Software License;BSD License;Python Software Foundation License;Mozilla Public License 2.0 (MPL 2.0);ISC License;Unlicense"
