[tox]
envlist = py311, py312, lint, typecheck, security, robot
minversion = 4.12
skip_missing_interpreters = true

[testenv]
description = Run unit tests
deps =
    pytest>=8.0
    pytest-cov>=4.1
    pytest-asyncio>=0.23
commands =
    pytest tests/unit -v --cov=src --cov-report=term --cov-report=xml {posargs}

[testenv:integration]
description = Run integration tests
deps =
    pytest>=8.0
    pytest-cov>=4.1
    pytest-asyncio>=0.23
commands =
    pytest tests/integration -v --cov=src --cov-report=term {posargs}

[testenv:lint]
description = Lint code with ruff
deps = ruff>=0.2
commands = ruff check src/ tests/

[testenv:typecheck]
description = Type check with mypy
deps = mypy>=1.8
commands = mypy src/

[testenv:security]
description = Run security checks
deps =
    bandit>=1.7
    safety>=3.0
commands =
    bandit -r src/ -f json -o bandit-report.json
    safety check --full-report

[testenv:robot]
description = Run Robot Framework tests
deps =
    robotframework>=7.0
    robotframework-requests>=0.9
commands =
    robot --outputdir tests/robot/output --loglevel TRACE tests/robot/

[testenv:coverage]
description = Generate coverage report
deps =
    pytest>=8.0
    pytest-cov>=4.1
    coverage>=7.4
commands =
    pytest tests/ --cov=src --cov-report=html --cov-report=xml
    coverage report --fail-under=80
