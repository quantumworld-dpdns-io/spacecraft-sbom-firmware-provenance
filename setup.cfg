[metadata]
name = spacecraft-sbom-provenance
version = 0.1.0
description = Spacecraft SBOM and firmware provenance vault
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/quantumworld-dpdns-io/spacecraft-sbom-firmware-provenance
license = MIT
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Aerospace
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires =
    fastapi>=0.109,<1
    uvicorn>=0.27,<1
    pydantic>=2.5,<3
    pydantic-settings>=2.1,<3
    sqlalchemy>=2.0,<3
    alembic>=1.13,<2
    httpx>=0.26,<1
    cryptography>=42.0,<43

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=8.0,<9
    pytest-cov>=4.1,<5
    mypy>=1.8,<2
    ruff>=0.2,<1
    pre-commit>=3.6,<4
test =
    robotframework>=7.0,<8
    robotframework-requests>=0.9,<1
    robotframework-seleniumlibrary>=6.1,<7
